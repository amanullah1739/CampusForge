<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Project | CampusForge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/projects/edit_project.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="edit-project-page">

    <!-- HEADER -->

    <div class="edit-header">

        <div>

            <span class="page-label">
                <i class="fa-solid fa-pen"></i>
                EDIT PROJECT
            </span>

            <h1>Edit Your Project</h1>

            <p>
                Update your project details and keep your portfolio fresh.
            </p>

        </div>

        <a href="{{ url_for('projects') }}"
           class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>
            Back to Projects

        </a>

    </div>


    <!-- FORM -->

    <div class="edit-card">

        <form method="POST"
              action="{{ url_for('edit_project', project_id=project.id) }}">

            <!-- PROJECT TITLE -->

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-heading"></i>
                    Project Title
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ project.title }}"
                    placeholder="Enter project title"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-align-left"></i>
                    Description
                </label>

                <textarea
                    name="description"
                    placeholder="Describe your project"
                    rows="6"
                >{{ project.description or '' }}</textarea>

            </div>


            <!-- GITHUB -->

            <div class="form-group">

                <label>
                    <i class="fa-brands fa-github"></i>
                    GitHub URL
                </label>

                <input
                    type="url"
                    name="github_url"
                    value="{{ project.github_url or '' }}"
                    placeholder="https://github.com/username/project"
                >

            </div>


            <!-- LIVE URL -->

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-globe"></i>
                    Live Project URL
                </label>

                <input
                    type="url"
                    name="live_url"
                    value="{{ project.live_url or '' }}"
                    placeholder="https://your-project.com"
                >

            </div>


            <!-- TECH STACK -->

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-layer-group"></i>
                    Tech Stack
                </label>

                <input
                    type="text"
                    name="tech_stack"
                    value="{{ project.tech_stack or '' }}"
                    placeholder="Python, Flask, PostgreSQL"
                >

                <small>
                    Separate technologies using commas.
                </small>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label>
                    <i class="fa-solid fa-chart-simple"></i>
                    Project Status
                </label>

                <select name="status">

                    <option value="Completed"
                        {% if project.status == "Completed" %}
                            selected
                        {% endif %}>
                        Completed
                    </option>

                    <option value="In Progress"
                        {% if project.status == "In Progress" %}
                            selected
                        {% endif %}>
                        In Progress
                    </option>

                    <option value="Planned"
                        {% if project.status == "Planned" %}
                            selected
                        {% endif %}>
                        Planned
                    </option>

                </select>

            </div>


            <!-- ACTIONS -->

            <div class="form-actions">

                <a href="{{ url_for('projects') }}"
                   class="cancel-btn">

                    Cancel

                </a>

                <button type="submit"
                        class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>

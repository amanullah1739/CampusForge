<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusForge | Profile Complete</title>


<link rel="stylesheet"
href="{{ url_for('static', filename='css/onboarding/complete.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="card">

<div class="success-icon">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>Welcome to CampusForge!</h1>

<p class="subtitle">
Your profile has been successfully created.
You're ready to start your engineering journey.
</p>

<div class="progress-section">

<h3>Profile Completion</h3>

<div class="progress-bar">

<div class="progress"></div>

</div>

<span>100% Completed</span>

</div>

<div class="summary">

<div class="item">

<i class="fa-solid fa-user-check"></i>

<span>Personal Information</span>

<i class="fa-solid fa-check done"></i>

</div>

<div class="item">

<i class="fa-solid fa-graduation-cap"></i>

<span>Academic Information</span>

<i class="fa-solid fa-check done"></i>

</div>

<div class="item">

<i class="fa-solid fa-code"></i>

<span>Skills & Interests</span>

<i class="fa-solid fa-check done"></i>

</div>

<div class="item">

<i class="fa-solid fa-link"></i>

<span>Developer Accounts</span>

<i class="fa-solid fa-check done"></i>

</div>

</div>

<div class="xp-card">

<div>

<h2>🏆 +250 XP</h2>

<p>Welcome Bonus</p>

</div>

<div>

<h2>🌟 Level 1</h2>

<p>Future Engineer</p>

</div>

</div>

<button class="dashboard-btn">

Explore Dashboard

<i class="fa-solid fa-arrow-right"></i>

</button>

</div>

</div>

<script src="{{ url_for('static', filename='js/onboarding/complete.js') }}"></script>

</body>

</html>

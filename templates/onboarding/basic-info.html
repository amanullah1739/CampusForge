<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusForge | Basic Information</title>

    
    <link rel="stylesheet"
href="{{ url_for('static', filename='css/onboarding/basic-info.css') }}">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="top">

            <h4>Step 2 of 5</h4>

            <div class="progress-bar">

                <div class="progress"></div>

            </div>

        </div>

        <h1>Complete Your Profile</h1>

        <p class="subtitle">

            Tell us about yourself.

        </p>

        <form method="POST" action="{{ url_for('basic_info') }}">

            <div class="row">

                <div class="input-box">

                    <label>Full Name</label>

                    <input type="text" name="full_name" placeholder="Enter your full name">

                </div>

                <div class="input-box">

                    <label>Roll Number</label>

                    <input type="text" name="roll_number" placeholder="University Roll Number">

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label>College Email</label>

                    <input type="email" name="college_email" placeholder="College Email">

                </div>

                <div class="input-box">

                    <label>Phone Number</label>

                    <input type="text" name="phone_number" placeholder="Phone Number">

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label>College</label>

                    <select name="college_id">
                        <option value="">Select College</option>

                        {% for college in colleges %}
                            <option value="{{ college.id }}">
                                {{ college.name }}
                            </option>
                        {% endfor %}
                    </select>

                </div>

                <div class="input-box">

                    <label>Department</label>

                    <select name="branch">

                        <option>Select Department</option>

                        <option>CSE</option>

                        <option>IT</option>

                        <option>ECE</option>

                        <option>EEE</option>

                    </select>

                </div>

            </div>

            <div class="row">

                <div class="input-box">

                    <label>Year</label>

                    <select name="year">

                        <option>Select Year</option>

                        <option>1st Year</option>

                        <option>2nd Year</option>

                        <option>3rd Year</option>

                        <option>4th Year</option>

                    </select>

                </div>

                <div class="input-box">

                    <label>Section</label>

                    <select name="section">

                        <option>Select Section</option>

                        <option>A</option>

                        <option>B</option>

                        <option>C</option>

                    </select>

                </div>

            </div>

            <div class="buttons">

                <a href="welcome.html" class="back">

                    ← Back

                </a>

                <button>

                    Continue →

                </button>

            </div>

        </form>

    </div>

</div>
<script src="{{ url_for('static', filename='js/onboarding/basic-info.js') }}"></script>
</body>

</html>

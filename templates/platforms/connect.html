<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect Platforms | CampusForge</title>
</head>

<body>

    <h1>Connect Coding Platforms</h1>

    <p>
        Connect your coding profiles to automatically track your progress.
    </p>

    <form method="POST" action="{{ url_for('connect_platform') }}">

        <div>

            {% if platform %}

                <input
                    type="hidden"
                    name="platform"
                    value="{{ platform }}"
                >

                <div class="selected-platform">

                    <i class="fa-brands
                        {% if platform == 'GitHub' %}
                            fa-github
                        {% else %}
                            fa-code
                        {% endif %}
                    "></i>

                    <span>
                        Connecting {{ platform }}
                    </span>

                </div>

            {% else %}

                <label>Platform</label>

                <select name="platform" required>

                    <option value="">
                        Select Platform
                    </option>

                    <option value="LeetCode">
                        LeetCode
                    </option>

                    <option value="Codeforces">
                        Codeforces
                    </option>

                    <option value="GitHub">
                        GitHub
                    </option>

                    <option value="GFG">
                        GeeksForGeeks
                    </option>

                    <option value="HackerRank">
                        HackerRank
                    </option>

                    <option value="CodeChef">
                        CodeChef
                    </option>

                    <option value="Kaggle">
                        Kaggle
                    </option>

                    <option value="LinkedIn">
                        LinkedIn
                    </option>

                </select>

            {% endif %}

        </div>

        <div>
            <label>Username / Handle</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >
        </div>

        <button type="submit">
            Connect Account
        </button>

    </form>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusForge | Sign Up</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/auth/signup.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Left Section -->

    <div class="left">

        <h1>CampusForge</h1>

        <p class="tagline">
            Build • Learn • Lead
        </p>

        <h2>Start Your Engineering Journey.</h2>

        <p class="desc">
            Join thousands of students, showcase your skills,
            build your portfolio, compete on leaderboards,
            and become placement ready.
        </p>

    </div>

    <!-- Right Section -->

    <div class="right">

        <form>

            <h2>Create Account</h2>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" placeholder="Full Name">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" placeholder="University Roll Number">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="College Email">
            </div>

            <div class="row">

                <select>

                    <option>Select Branch</option>
                    <option>CSE</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>ME</option>

                </select>

                <select>

                    <option>Year</option>
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>

                </select>

            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Confirm Password">
            </div>

            <div class="check">

                <input type="checkbox">

                <label>
                    I agree to the Terms & Conditions
                </label>

            </div>

            <button>Create Account</button>

            <div class="divider">
                OR
            </div>

            <div class="social">

                <button class="google">
                    Google
                </button>

                <button class="github">
                    GitHub
                </button>

            </div>

            <p class="login">

                Already have an account?

                <a href="index.html">Login</a>

            </p>

        </form>

    </div>

</div>
<script src="{{ url_for('static', filename='js/auth/auth.js') }}"></script>
</body>
</html>

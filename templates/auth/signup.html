<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusForge | Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth/signup.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Left Section -->
    <div class="left">

        <h1>CampusForge</h1>

        <p class="tagline">
            Build • Learn • Lead
        </p>

        <h2>Start Your Engineering Journey.</h2>

        <p class="desc">
            Join thousands of students, showcase your skills,
            build your portfolio, compete on leaderboards,
            and become placement ready.
        </p>

    </div>

    <!-- Right Section -->
    <div class="right">

        <form method="POST">

            <h2>Create Account</h2>

            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input
                    type="text"
                    name="full_name"
                    placeholder="Full Name"
                    autocomplete="name"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-id-card"></i>
                <input
                    type="text"
                    name="roll_number"
                    placeholder="University Roll Number"
                    autocomplete="off"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    name="email"
                    placeholder="College Email"
                    autocomplete="email"
                    required>
            </div>

            <div class="row">

                <select name="branch" required>

                    <option value="">Select Branch</option>
                    <option>CSE</option>
                    <option>IT</option>
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>ME</option>

                </select>

                <select name="year" required>

                    <option value="">Year</option>
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>

                </select>

            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="check">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <label for="terms">
                    I agree to the Terms & Conditions
                </label>

            </div>

            <button type="submit">
                Create Account
            </button>

            <div class="divider">
                OR
            </div>

            <div class="social">

                <button type="button" class="google">
                    Google
                </button>

                <button type="button" class="github">
                    GitHub
                </button>

            </div>

            <p class="login">

                Already have an account?

                <a href="{{ url_for('login') }}">Login</a>

            </p>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='js/auth/auth.js') }}"></script>

</body>
</html>
